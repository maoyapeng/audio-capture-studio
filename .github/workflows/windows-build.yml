name: Windows build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt "pyinstaller>=6,<7"
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v
      - name: Build application
        run: python -m PyInstaller --noconfirm --clean --windowed --onedir --name AudioCaptureStudio --collect-all sounddevice --collect-all _sounddevice_data --collect-all soundfile --collect-all telnetlib3 main.py
      - uses: actions/upload-artifact@v4
        with:
          name: AudioCaptureStudio-Windows-x64
          path: dist/AudioCaptureStudio/
          retention-days: 7
