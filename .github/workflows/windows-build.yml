name: Windows build

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt "pyinstaller>=6,<7"
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v
      - name: Prepare pinned ADB
        run: python scripts/prepare_adb.py
      - name: Build application
        run: python -m PyInstaller --noconfirm --clean --windowed --onedir --name AudioCaptureStudio --add-data "vendor/adb;vendor/adb" --collect-all sounddevice --collect-all _sounddevice_data --collect-all soundfile --collect-all telnetlib3 main.py
      - name: Check packaged application starts
        shell: pwsh
        run: |
          & 'dist/AudioCaptureStudio/_internal/vendor/adb/adb.exe' version
          if ($LASTEXITCODE -ne 0) { throw 'Bundled ADB failed to start' }
          $app = Start-Process -FilePath 'dist/AudioCaptureStudio/AudioCaptureStudio.exe' -ArgumentList '--demo' -PassThru
          Start-Sleep -Seconds 10
          if ($app.HasExited) { throw "Packaged application exited during startup: $($app.ExitCode)" }
          Stop-Process -Id $app.Id
      - name: Package distribution
        shell: pwsh
        run: |
          Copy-Item README.md dist/AudioCaptureStudio/README.md
          Compress-Archive -Path dist/AudioCaptureStudio -DestinationPath dist/AudioCaptureStudio-v0.1.6-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AudioCaptureStudio-Windows-x64
          path: dist/AudioCaptureStudio-v0.1.6-Windows-x64.zip
          retention-days: 30
      - name: Publish downloadable Windows release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release $tag already exists" }
          gh release create $tag 'dist/AudioCaptureStudio-v0.1.6-Windows-x64.zip' --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'AudioCapture Studio 0.1.6 - Windows x64' --prerelease --notes 'Windows x64 preview. Extract the complete ZIP and run AudioCaptureStudio.exe. Includes runtime dependencies; Python is not required. Demo startup and automated tests checked in CI. Real USB and remote devices still need hardware validation. Includes pinned Platform Tools 35.0.2 ADB runtime.'
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
