[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "audio-capture-studio"
version = "0.1.8"
description = "Windows multi-device audio recording workbench"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["audio_capture*"]

[project.scripts]
audio-capture-studio = "audio_capture.app:main"
